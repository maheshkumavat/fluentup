<body class="flex flex-col h-screen max-w-md mx-auto relative">

</div>

</header>
<!-- Slides Container -->
<main class="flex-1 overflow-x-auto snap-x flex h-full" id="slider">

</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile mb-stack-sm">Speak with Confidence</h1>
<p class="font-body-md text-body-md text-secondary max-w-[280px]">Practice English in a safe, quiet space.</p>
</div>
</section>
<!-- Slide 2: Master Grammar -->
<section class="min-w-full h-full snap-center flex flex-col pt-24 pb-32 px-container-padding border-l border-outline-variant">
<div class="flex-1 flex flex-col justify-center items-center text-center">
<div class="w-full aspect-square mb-12 flex items-center justify-center bg-surface-container rounded-xl overflow-hidden">
<img class="onboarding-image w-4/5 h-4/5 object-contain" data-alt="A sophisticated editorial-style line drawing of an open textbook with clear grammatical diagrams and a floating pencil. The aesthetic is clean and academic, utilizing crisp black lines on a cream-colored paper-like background. The image evokes the clarity of a modern high-end dictionary or scholarly publication. Minimalist and high-contrast, perfectly suited for a focused learning environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCUyvQywTvevb8FpHhnDGDR5pwsnDFvZZkmQ2QJTTUC1QJai4fKmcFQapJBFJH2DUoPfswkYpwiq7wrBkl4BX2J2CKUQdFi5-da_iQzCf5lo6bhjpKLvTf71Dh_qQx9ZwHBk5uUHRzXCja7uxYF9__KRGqzTQ9J-E7EbYWvKRbwXgSMt7GIfBk4pmfGiiWqTZU1qnBzG1eNItjt9w54nGxAfG7LRE75YDzvqIv26qVMs3mmonHhazwftxFlpnccA8o4k1XYGzbTVZqf"/>

<!-- Footer Controls -->
<footer class="fixed bottom-0 left-0 right-0 max-w-md mx-auto px-container-padding py-8 bg-[#FDFDFB]">
<div class="flex flex-col items-center gap-8">
<!-- Dot Pagination -->
<div class="flex gap-2" id="pagination">
<div class="dot w-2 h-2 rounded-full bg-primary transition-all duration-300" data-slide="0"></div>
<div class="dot w-2 h-2 rounded-full bg-outline-variant transition-all duration-300" data-slide="1"></div>
<div class="dot w-2 h-2 rounded-full bg-outline-variant transition-all duration-300" data-slide="2"></div>
</div>
<!-- Action Button -->
<div class="w-full h-14 relative overflow-hidden">
<button class="w-full h-full bg-primary-container text-on-primary rounded-lg font-label-md text-label-md flex items-center justify-center transition-transform active:scale-95" id="next-btn">
                    Next
                </button>
<button class="absolute inset-0 w-full h-full bg-primary-container text-on-primary rounded-lg font-label-md text-label-md flex items-center justify-center opacity-0 pointer-events-none transform translate-y-full transition-all duration-300" id="start-btn">
                    Get Started
                </button>
</div>
</div>
</footer>
<script>
        const slider = document.getElementById('slider');
        const dots = document.querySelectorAll('.dot');
        const nextBtn = document.getElementById('next-btn');
        const startBtn = document.getElementById('start-btn');
        let currentSlide = 0;

        const updateUI = (index) => {
            currentSlide = index;
            
            // Update dots
            dots.forEach((dot, i) => {
                if(i === index) {
                    dot.classList.remove('bg-outline-variant');
                    dot.classList.add('bg-primary', 'w-4');
                } else {
                    dot.classList.add('bg-outline-variant');
                    dot.classList.remove('bg-primary', 'w-4');
                }
            });

            // Toggle Buttons on last slide
            if (index === 2) {
                nextBtn.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-100%]');
                startBtn.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-full');
            } else {
                nextBtn.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-100%]');
                startBtn.classList.add('opacity-0', 'pointer-events-none', 'translate-y-full');
            }
        };

        slider.addEventListener('scroll', () => {
            const index = Math.round(slider.scrollLeft / slider.clientWidth);
            if (index !== currentSlide) {
                updateUI(index);
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentSlide < 2) {
                slider.scrollTo({
                    left: (currentSlide + 1) * slider.clientWidth,
                    behavior: 'smooth'
                });
            }
        });

        // Initialize first state
        updateUI(0);

        // Simple haptic-like feedback on interactions
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => {
            btn.addEventListener('touchstart', () => {
                if (window.navigator.vibrate) window.navigator.vibrate(10);
            });
        });
    </script>
